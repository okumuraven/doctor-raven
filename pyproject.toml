[project]
name = "doctor-raven"
version = "0.1.0"
description = "Doctor Raven — a local-first intelligent assistant for daily engineering/security work on Parrot OS"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "anthropic>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
raven = "doctor_raven.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doctor_raven*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
